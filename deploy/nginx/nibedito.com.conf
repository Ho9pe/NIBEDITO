# Host-level reverse proxy for nibedito.com.
#
# Copy to /etc/nginx/sites-available/nibedito.com on the droplet, symlink it
# into sites-enabled, then run certbot --nginx. Certbot rewrites this file in
# place to add the TLS listener and the http->https redirect, so what is here is
# only the plain-http starting point.
#
# Frontend and API share one origin, split by path. That is deliberate: it means
# the browser treats every API call as same-site, so the SameSite cookie problem
# that breaks logins on split-host deployments cannot occur, and CORS never
# enters the picture.

# www -> apex. Pick one canonical host and keep it: CLIENT_URL is compared
# exactly by the API's CORS check, so serving both would fail on whichever one
# is not configured.
server {
    listen 80;
    listen [::]:80;
    server_name www.nibedito.com;
    return 301 https://nibedito.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nibedito.com;

    # Product and avatar uploads go through multer, which caps files at 10 MB
    # and rejects anything larger with a readable JSON error. Nginx's own
    # default is 1 MB, and it would reject first - with an HTML 413 page the
    # frontend cannot parse. Sitting just above multer's limit keeps the app's
    # error message the one people actually see.
    client_max_body_size 12M;

    # Express is behind a proxy and runs app.set("trust proxy", 1), so it reads
    # the client address from X-Forwarded-For. Without these the rate limiter
    # sees every request as coming from the same address - the proxy's - and
    # one busy visitor would throttle everyone.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
    }

    # Outside /api/, so it needs its own rule. This is what UptimeRobot polls.
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
